name: 商品のカテゴリーを変更
description: 登録済みの商品をApple製品・カメラ・その他へ移動します
title: "[カテゴリー変更] "
body:
  - type: markdown
    attributes:
      value: |
        商品カードのカテゴリー選択から開くと、商品IDと変更先が自動入力されます。
  - type: input
    id: product-id
    attributes:
      label: 商品ID
      description: 商品データのIDを入力してください。
      placeholder: iphone-air
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: カテゴリー
      options:
        - Apple製品
        - カメラ
        - その他
    validations:
      required: true
