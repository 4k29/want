name: Wishlist sync v2
on:
  issues:
    types: [opened, reopened]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save:
    if: github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && github.actor == github.repository_owner && startsWith(github.event.issue.title, '[Wishlist v2] Save ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/save-snapshot.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app-v2.js
          node --check sync-v2.js
          node --check model.js
          node --check scripts/save-snapshot.mjs
      - run: npm test

  deploy:
    needs: [save, test]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.test.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: wishlist-pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html style.css app-v2.js model.js sync-v2.js .nojekyll _site/
          cp data/wishlist.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
