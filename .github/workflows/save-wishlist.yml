name: Save wishlist and publish
on:
  issues:
    types: [opened, reopened]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  save:
    if: github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner && github.actor == github.repository_owner && startsWith(github.event.issue.title, '[Wishlist] 保存 ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/save-issue.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    needs: save
    if: always() && (needs.save.result == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: wishlist-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js model.js sync.js .nojekyll _site/
          cat autosync.js >> _site/app.js
          sed -i 's#app.js?v=7#app.js?v=8#' _site/index.html
          cp data/wishlist.json _site/data/
          node --check _site/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
