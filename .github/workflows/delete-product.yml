name: Delete product from list

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: want-product-additions
  cancel-in-progress: false

jobs:
  delete-product:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[商品削除]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Delete product data
        id: delete
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: node scripts/delete-product.mjs > delete-result.json

      - name: Commit updated wish list
        if: steps.delete.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "Delete product from issue #${{ github.event.issue.number }}"
          git push origin HEAD:main

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const succeeded = '${{ steps.delete.outcome }}' === 'success';
            let result = {};
            try { result = JSON.parse(fs.readFileSync('delete-result.json', 'utf8')); } catch {}
            const safe = (value) => String(value ?? '')
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;');
            const body = succeeded
              ? `## 商品を削除しました\n\n- **商品名:** ${safe(result.name)}\n- **商品ID:** \`${safe(result.id)}\`\n\n\`products.json\`とGitHub Pagesへ反映します。`
              : '## 削除できませんでした\n\n商品IDまたは商品URLを確認してIssueを編集してください。';

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

            if (succeeded) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
            }
