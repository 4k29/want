name: Add product from link

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  add-product:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[商品追加]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Inspect product page
        id: inspect
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/inspect-product.mjs > product-result.json

      - name: Add or update product data
        id: update
        if: steps.inspect.outcome == 'success'
        run: node scripts/add-product.mjs | tee update-result.txt

      - name: Commit product to the wish list
        id: commit
        if: steps.inspect.outcome == 'success' && steps.update.outcome == 'success'
        run: |
          if git diff --quiet -- products.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "Add product from issue #${{ github.event.issue.number }}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Post result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const inspectSucceeded = '${{ steps.inspect.outcome }}' === 'success';
            const updateSucceeded = '${{ steps.update.outcome }}' === 'success';
            let result = {};
            try { result = JSON.parse(fs.readFileSync('product-result.json', 'utf8')); } catch {}
            const safe = (value) => String(value ?? '')
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;');

            let body;
            if (inspectSucceeded && updateSucceeded) {
              const price = new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY', maximumFractionDigits: 0 }).format(Number(result.price));
              const action = fs.existsSync('update-result.txt') && fs.readFileSync('update-result.txt', 'utf8').startsWith('updated:') ? '更新' : '追加';
              body = [
                `## 商品を自動${action}しました`,
                '',
                `- **商品名:** ${safe(result.name)}`,
                `- **価格:** ${safe(price)}`,
                `- **販売元:** ${safe(result.brand || result.sourceHost || '不明')}`,
                `- **URL:** ${safe(result.url)}`,
                '',
                result.image ? `![商品画像](${result.image})` : '',
                '',
                '商品情報を `products.json` に反映しました。GitHub Pagesもこの更新後のデータを読み込みます。',
              ].filter(Boolean).join('\n');
            } else {
              body = [
                '## 自動追加できませんでした',
                '',
                '商品ページから商品名または価格を取得できませんでした。',
                'JavaScriptでのみ価格を表示するサイトや、アクセスを制限しているサイトでは取得できない場合があります。',
                '',
                'URLを確認してIssueを編集すると、もう一度自動取得します。',
              ].join('\n');
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

            if (inspectSucceeded && updateSucceeded) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
            }
